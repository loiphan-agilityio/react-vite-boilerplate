# Netlify hosting for apps/web. CI (.github/workflows/ci.yml) builds the app and runs
# `netlify deploy --no-build --filter web --dir apps/web/dist` from the repository root, which
# applies the redirects and headers below. [build] applies only when Netlify builds from git itself
# instead (base directory apps/web).
[build]
  # The mocked API: a new app has no backend yet. Once it has one, set VITE_API_URL and switch to
  # `pnpm build` (here and in CI).
  command = "pnpm build:mock"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# A file under assets/ that is gone (a tab still open on the previous release asks for an old
# chunk) is a 404, not index.html: HTML served for a script fails the import with a MIME error,
# and the immutable header below would cache it for a year. src/main.tsx reloads such a tab once.
# Netlify matches headers by the requested path, so this 404 carries that immutable header too (a
# no-store rule for /404.html does not reach it): after a rollback to a release that has the file, a
# browser that got the 404 needs a hard reload.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: a path that is not a file serves index.html, so deep links and reloads reach
# React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. The Storybook deploy shares this file (`--filter web`), so
# they suit both sites: SAMEORIGIN, not DENY, since Storybook frames its own iframe.html. The
# app's Content-Security-Policy is a <meta> tag in its built index.html (vite.config.ts), which
# leaves Storybook's inline scripts alone.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Vite hashes every file in assets/, so a cached copy is never stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The MSW worker keeps its name across releases: always revalidate it.
[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache"
