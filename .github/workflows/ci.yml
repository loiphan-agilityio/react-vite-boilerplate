# CI/CD for this monorepo on GitHub Actions. Every command runs from the root through turbo; the
# deployed app is apps/web.
#
# - check: lint, typecheck, unit tests with coverage, build and Storybook build (and, in the
#   boilerplate itself, the project generator's tests).
# - e2e: the Playwright tests against the app built on the mocked API (`pnpm build:mock`).
# - deploy-draft: once both pass, the app and Storybook they built go to Netlify as a draft:
#   `pr-<number>--<site>` on a pull request, a unique draft URL on a push to main.
# - e2e-deployed: the same Playwright tests against that deploy URL.
# - lighthouse: Lighthouse (mobile) on that deploy URL; accessibility under 100 or SEO under 95
#   fails it, performance and best practices only warn (tools/lighthouse.mjs).
# - deploy-production (push to main only): once both pass, the same files go live.
#
# Deploys need the NETLIFY_AUTH_TOKEN secret and the NETLIFY_SITE_ID variable (Settings > Secrets
# and variables > Actions); NETLIFY_STORYBOOK_SITE_ID adds a second site for Storybook. Without
# NETLIFY_SITE_ID the deploy jobs are skipped, and so are pull requests from forks and Dependabot's,
# which get no Actions secrets: their checks and mock-build e2e still run, and main deploys after
# the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request cancels its run; runs on main finish, so a deploy is never cut.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # Adds pipefail, so a failing command before a pipe fails the step.
    shell: bash

env:
  NETLIFY_CLI: netlify-cli@27.14.1

jobs:
  check:
    name: 'Checks: lint, typecheck, unit, build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm check` minus test:e2e, which runs in its own job, in parallel. tools/check-report.mjs
      # runs every gate even after one fails and writes the checklist (pass rates, coverage) to the
      # run's summary page.
      - run: pnpm check:report --skip e2e
      # What check:report and the lighthouse job conclude from their tools' output.
      - name: Test the repo's tools
        run: pnpm test:tools
      # The generator exists only in the boilerplate: a project created from it has no create/.
      - name: Test the project generator
        if: ${{ hashFiles('create/index.test.js') != '' }}
        run: node --test create/index.test.js
      # The deploy jobs publish this Storybook build instead of building it again.
      - uses: actions/upload-artifact@v7
        if: ${{ vars.NETLIFY_STORYBOOK_SITE_ID != '' }}
        with:
          name: storybook
          path: apps/web/storybook-static/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: 'E2E: mock build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Builds on mocks into dist-e2e/ and serves it with `vite preview`
      # (apps/web/playwright.config.ts); the e2e pass rate goes to the run's summary page.
      - run: pnpm check:report --only e2e
      # The deploy jobs publish the build these tests passed on. Once the app has a backend, upload
      # apps/web/dist/ from check's `pnpm build` (with VITE_API_URL) as `app` instead.
      - uses: actions/upload-artifact@v7
        if: ${{ vars.NETLIFY_SITE_ID != '' }}
        with:
          name: app
          path: apps/web/dist-e2e/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  deploy-draft:
    name: 'Deploy: Netlify draft'
    needs: [check, e2e]
    if: >-
      vars.NETLIFY_SITE_ID != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      url: ${{ steps.app.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_STORYBOOK_SITE_ID: ${{ vars.NETLIFY_STORYBOOK_SITE_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: apps/web/dist/
      - uses: actions/download-artifact@v8
        if: ${{ env.NETLIFY_STORYBOOK_SITE_ID != '' }}
        with:
          name: storybook
          path: apps/web/storybook-static/
      # A draft must stay out of search results: Netlify adds a `_headers` file's rules to
      # netlify.toml's, and only this job's copy of the build gets one (production downloads the
      # artifact again, without it).
      - name: Keep the drafts out of search engines
        run: |
          for dir in apps/web/dist apps/web/storybook-static; do
            if [[ -d "$dir" ]]; then printf '/*\n  X-Robots-Tag: noindex\n' >> "$dir/_headers"; fi
          done
      - name: Deploy the app (draft)
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
          # On a pull request github.sha is the merge commit; the checks list shows the head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Netlify's monorepo mode, from the root: --filter picks the web app, --dir is resolved
        # against the root, and apps/web/netlify.toml (redirects, headers) applies.
        run: |
          alias=()
          if [[ -n "$PR_NUMBER" ]]; then alias=(--alias "pr-$PR_NUMBER"); fi
          url="$(npx -y "$NETLIFY_CLI" deploy --no-build --filter web --dir apps/web/dist \
            --site "$NETLIFY_SITE_ID" "${alias[@]}" --message "$GITHUB_SHA" --json |
            jq -r .deploy_url)"
          [[ "$url" == https://* ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "App: $url" >> "$GITHUB_STEP_SUMMARY"
          # A commit status whose Details link in the checks list opens the deploy.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success \
            -f context='Preview - Webapp Deployment' -f target_url="$url" \
            -f description='Draft deploy'
      - name: Deploy Storybook (draft)
        if: ${{ env.NETLIFY_STORYBOOK_SITE_ID != '' }}
        run: |
          alias=()
          if [[ -n "$PR_NUMBER" ]]; then alias=(--alias "pr-$PR_NUMBER"); fi
          url="$(npx -y "$NETLIFY_CLI" deploy --no-build --filter web \
            --dir apps/web/storybook-static --site "$NETLIFY_STORYBOOK_SITE_ID" "${alias[@]}" \
            --message "$GITHUB_SHA" --json | jq -r .deploy_url)"
          [[ "$url" == https://* ]]
          echo "Storybook: $url" >> "$GITHUB_STEP_SUMMARY"

  e2e-deployed:
    name: 'E2E: Netlify draft'
    needs: deploy-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # With E2E_BASE_URL set, Playwright starts no server and tests the deploy itself.
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy-draft.outputs.url }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-deployed
          path: apps/web/playwright-report/
          retention-days: 14

  lighthouse:
    name: 'Lighthouse: Netlify draft'
    needs: deploy-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The script needs Node only: Lighthouse comes through npx, Chrome is on the runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/lighthouse.mjs "$URL"
        env:
          URL: ${{ needs.deploy-draft.outputs.url }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  deploy-production:
    name: 'Deploy: Netlify production'
    needs: [e2e-deployed, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Approvals or branch rules for production can be set on this environment in the settings.
    environment: production
    permissions:
      contents: read
      statuses: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_STORYBOOK_SITE_ID: ${{ vars.NETLIFY_STORYBOOK_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: apps/web/dist/
      - uses: actions/download-artifact@v8
        if: ${{ env.NETLIFY_STORYBOOK_SITE_ID != '' }}
        with:
          name: storybook
          path: apps/web/storybook-static/
      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(npx -y "$NETLIFY_CLI" deploy --no-build --filter web --dir apps/web/dist \
            --site "$NETLIFY_SITE_ID" --prod --message "$GITHUB_SHA" --json | jq -r .url)"
          echo "App: $url" >> "$GITHUB_STEP_SUMMARY"
          # A commit status whose Details link in the checks list opens the live site.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success \
            -f context='Prod - Webapp Deployment' -f target_url="$url" \
            -f description='Live site'
      - name: Publish Storybook
        if: ${{ env.NETLIFY_STORYBOOK_SITE_ID != '' }}
        run: |
          url="$(npx -y "$NETLIFY_CLI" deploy --no-build --filter web \
            --dir apps/web/storybook-static --site "$NETLIFY_STORYBOOK_SITE_ID" --prod \
            --message "$GITHUB_SHA" --json | jq -r .url)"
          echo "Storybook: $url" >> "$GITHUB_STEP_SUMMARY"
